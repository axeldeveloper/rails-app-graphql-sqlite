default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

defaultlite: &defaultlite
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *defaultlite
  database: db/development.sqlite3


test:
  <<: *defaultlite
  database: db/test.sqlite3

production:
  <<: *default
